# pubspec.yaml
name: weatherly
description: Weatherly mobile app
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.5
  cupertino_icons: ^1.0.8
  geolocator: ^12.0.0
  http: ^1.2.1
  intl: ^0.19.0
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/splash/
    - assets/branding/
  shaders:
    - shaders/write_on.frag

flutter_native_splash:
  color: "#FFFFFF"
  android_12:
    color: "#FFFFFF"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.webp
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.webp